appId: com.soundisle.pc
productName: SoundIsle
asar: true
# Reuse the runtime installed by npm, avoiding a second Electron download.
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - desktop/**
  - dist/**
  - package.json
mac:
  identity: '-'
  category: public.app-category.music
  target: [dmg, zip]
  extendInfo:
    NSMicrophoneUsageDescription: 声屿需要使用麦克风，将语音转换成文字以便与阿屿交流。
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  category: AudioVideo
